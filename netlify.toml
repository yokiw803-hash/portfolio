# Netlify Configuration for Yokeshwaran Portfolio

[build]
  publish = "."

[[redirects]]
  from = "/resume"
  to = "/resume.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
